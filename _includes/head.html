<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {{ site.data.site.site_name }}{% else %}{{ site.data.site.site_name }} — {{ site.data.site.tagline }}{% endif %}</title>
<script src="{{ site.baseurl }}/support.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet">
<script src="{{ site.baseurl }}/image-slot.js"></script>
<style>
  html,body{margin:0;padding:0;background:#fff;color:#0a0a0a;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  a:hover{opacity:.55}
  ::selection{background:#0a0a0a;color:#fff}
  @keyframes jg-fade{from{opacity:0;transform:translateY(.45em)}to{opacity:1;transform:none}}
  html{scroll-behavior:smooth}
  @keyframes jg-up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes jg-in{from{opacity:0}to{opacity:1}}
  header{animation:jg-in .8s ease both}
  header nav a{position:relative}
  header nav a::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.16,1,.3,1)}
  header nav a:hover::after{transform:scaleX(1)}
  header nav a:hover{opacity:1}
  header button{transition:transform .5s cubic-bezier(.16,1,.3,1),background .3s ease,color .3s ease}
  header button:hover{transform:rotate(-18deg) scale(1.06)}
  header>div>div span{transition:transform .35s cubic-bezier(.16,1,.3,1),width .35s ease}
  header>div>div:hover span:nth-child(2){width:20px!important}
  footer>a{display:inline-block;transition:transform .7s cubic-bezier(.16,1,.3,1),opacity .4s ease}
  footer>a:hover{transform:translateX(-14px);opacity:1}
  footer a,section a{transition:opacity .3s ease}
  #top>div>div,#top h1{animation:jg-up 1s cubic-bezier(.16,1,.3,1) both}
  #top h1{animation-delay:.12s}
  #top>div:last-of-type{animation:jg-in 1.2s ease .4s both}
  #work>div.work-grid>*>div:first-child{transition:transform .9s cubic-bezier(.16,1,.3,1)}
  #work>div.work-grid>*:hover>div:first-child{transform:scale(1.03)}
  #work>div.work-grid>*>div:last-child{transition:transform .6s cubic-bezier(.16,1,.3,1)}
  #work>div.work-grid>*:hover>div:last-child{transform:translateX(8px)}
  #services>div>div{transition:background .6s ease}
  #services>div>div:hover{background:rgba(255,255,255,.03)}
  #work>div.work-grid>*:nth-child(4n+1),#work>div.work-grid>*:nth-child(4n){grid-column:span 4}
  #work>div.work-grid>*:nth-child(4n+2),#work>div.work-grid>*:nth-child(4n+3){grid-column:span 2}
  #work>div.work-grid>*:nth-child(4n+1)>div:first-child,#work>div.work-grid>*:nth-child(4n)>div:first-child{aspect-ratio:16/10}
  #work>div.work-grid>*:nth-child(4n+2)>div:first-child,#work>div.work-grid>*:nth-child(4n+3)>div:first-child{aspect-ratio:3/4}
  #space>div>div{transition:transform 1s cubic-bezier(.16,1,.3,1)}
  #space>div>div:hover{transform:translateY(-6px)}

  html[data-theme="dark"],html[data-theme="dark"] body{background:#0a0a0a!important;color:#fff!important}
  html[data-theme="dark"] header{background:rgba(10,10,10,.94)!important}
  html[data-theme="dark"] header img,html[data-theme="dark"] footer img{filter:invert(1)}
  html[data-theme="dark"] header span[style*="background:#0a0a0a"]{background:#fff!important}
  html[data-theme="dark"] header button{color:#fff!important;border-color:#fff!important}
  html[data-theme="dark"] section,html[data-theme="dark"] footer{background:#0a0a0a!important;color:#fff!important;border-color:#2a2a2a!important}
  html[data-theme="dark"] section[id="services"]{background:#141414!important}
  html[data-theme="dark"] div[style*="background:#f2f2f0"]{background:#1c1c1c!important}
  html[data-theme="dark"] span[style*="background:#0a0a0a"]{background:#fff!important}
  html[data-theme="dark"] a[style*="border-bottom:2px solid #0a0a0a"]{border-color:#fff!important}
  html[data-theme="dark"] [style*="color:#0a0a0a"]{color:#fff!important}
  html[data-theme="dark"] [style*="color:#555"],html[data-theme="dark"] [style*="color:#444"],html[data-theme="dark"] [style*="color:#333"],html[data-theme="dark"] [style*="color:#666"]{color:#a8a8a8!important}
  html[data-theme="dark"] [style*="color:#ccc"],html[data-theme="dark"] [style*="color:#bbb"]{color:#4a4a4a!important}
  html[data-theme="dark"] [style*="color:#5a5a5a"],html[data-theme="dark"] [style*="color:#8a8a8a"],html[data-theme="dark"] [style*="color:#9a9a9a"]{color:#8f8f8f!important}
  html[data-theme="dark"] [style*="color:#b4b4b4"],html[data-theme="dark"] [style*="color:#c4c4c4"]{color:#5c5c5c!important}
  html[data-theme="dark"] div[style*="background:#f2f2f0"]{background:#181818!important}
  html[data-theme="dark"] .work-drawer-card{background:#141414!important;color:#fff!important;border-color:#2a2a2a!important}

  @media (max-width:820px){
    header{padding:16px 20px!important;gap:12px!important}
    header>div{gap:14px!important}
    header nav{gap:18px!important;font-size:15px!important}
    header img{height:26px!important}
    header button{padding:6px 10px!important;font-size:11px!important}
    #top{padding:8px 20px 40px!important}
    #top>div:first-of-type{gap:40px!important;padding:8px 0 40px!important;font-size:17px!important}
    #top>div{grid-template-columns:1fr!important;gap:16px!important}
    #top h1{font-size:44px!important;text-align:left!important}
    #top>div:last-of-type{margin-top:48px!important}
    #top span[style*="padding-left"]{padding-left:0!important}
    #top>div:last-of-type>div{justify-content:flex-start!important}
    #work{padding:0 20px 48px!important}
    #work>div.work-grid{grid-template-columns:1fr!important;gap:32px!important}
    #work>div.work-grid>*{grid-column:auto!important}
    #work>div.work-grid>*>div:first-child{aspect-ratio:4/3!important}
    #space{padding:56px 20px 64px!important}
    #space>div:first-child{grid-template-columns:1fr!important;gap:20px!important}
    #space>div:first-child p{font-size:17px!important}
    #space>div[style*="56vh"]{height:38vh!important;min-height:240px!important}
    #space>div:last-child{grid-template-columns:1fr!important}
    #about{padding:56px 20px!important}
    #about p{font-size:24px!important}
    #about>div{flex-wrap:wrap!important;gap:20px!important}
    #services{padding:56px 20px 40px!important}
    #services h2{margin-bottom:40px!important;font-size:26px!important}
    #services>div{flex-direction:column!important}
    #services>div>div{flex:none!important;min-height:0!important;padding:24px 0!important;border-left:none!important;border-top:1px solid #3a3a3a!important}
    #services>div>div:first-child{border-top:none!important}
    #services ul{opacity:1!important;transform:none!important;min-width:0!important}
    #services ul li{opacity:1!important;transform:none!important}
    #services h3{color:#fff!important}
    #services span{opacity:1!important;font-size:64px!important;margin-top:24px!important}
    #contact{padding:64px 20px 40px!important}
    #contact>a{text-align:left!important;font-size:52px!important}
    #contact>div{grid-template-columns:1fr!important;gap:36px!important;margin-top:64px!important}
    #contact p[style*="padding-left"],#contact div[style*="padding-left"]{padding-left:0!important}
    #contact p[style*="margin:120px"]{margin-top:32px!important}
    section{padding-left:20px!important;padding-right:20px!important}
    .work-drawer-body{grid-template-columns:1fr!important}
  }

  #jg-load{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#fff;animation:jg-load-out .75s cubic-bezier(.7,0,.2,1) 1.15s forwards}
  #jg-load img{width:72px;display:block;animation:jg-load-mark 1.05s cubic-bezier(.16,1,.3,1) both}
  #jg-load span{display:block;height:1px;width:120px;background:#0a0a0a;transform-origin:left;animation:jg-load-rule 1.15s cubic-bezier(.5,0,.2,1) both}
  @keyframes jg-load-mark{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes jg-load-rule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes jg-load-out{to{transform:translateY(-101%)}}
  html[data-theme="dark"] #jg-load{background:#0a0a0a!important}
  html[data-theme="dark"] #jg-load img{filter:invert(1)}
  html[data-theme="dark"] #jg-load span{background:#fff}
  @media (prefers-reduced-motion:reduce){#jg-load{display:none}}
</style>
</head>
