<section id="work" style="padding:0 16px 96px;position:relative">
  <!-- Exclusive Work Section Quick Detail Drawer -->
  <div id="work-detail-drawer" class="work-drawer-card" style="display:none;margin-bottom:48px;padding:36px 40px;background:#f9f9f7;border:1px solid #e0e0dc;border-radius:12px;position:relative;animation:jg-up .4s cubic-bezier(.16,1,.3,1)">
    <button id="work-drawer-close" aria-label="Close details" style="position:absolute;top:24px;right:28px;background:none;border:none;font-size:28px;cursor:pointer;line-height:1;color:#8a8a8a">&times;</button>
    <div style="font-size:12px;font-weight:500;color:#9a9a9a;letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px">Work Details &mdash; Exclusive Overview</div>
    <div class="work-drawer-body" style="display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:start">
      <div>
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:14px">
          <span id="drawer-no" style="font-size:14px;font-weight:500;color:#9a9a9a"></span>
          <h3 id="drawer-title" style="margin:0;font-size:32px;font-weight:500;letter-spacing:-0.02em"></h3>
        </div>
        <p id="drawer-tags" style="margin:0 0 20px;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.09em;color:#8a8a8a"></p>
        <p id="drawer-description" style="margin:0 0 24px;font-size:18px;line-height:1.6;color:#444"></p>
        <a id="drawer-casestudy-link" href="#" style="display:inline-block;padding:12px 24px;background:#0a0a0a;color:#fff;font-size:14px;font-weight:500;border-radius:999px;transition:opacity .2s">View Full Case Study &rarr;</a>
      </div>
      <div style="background:#fff;padding:24px;border-radius:8px;border:1px solid #e5e5e0">
        <h4 style="margin:0 0 16px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:#9a9a9a">Project Specifications</h4>
        <div id="drawer-details-list" style="display:flex;flex-direction:column;gap:14px;font-size:14px"></div>
      </div>
    </div>
  </div>

  <!-- Work Grid -->
  <div class="work-grid" style="display:grid;grid-template-columns:repeat(6,1fr);align-items:start;gap:72px 16px">
    {% assign projects = site.projects | sort: "no" %}
    {% for p in projects %}
      <div data-reveal="" class="work-tile-item" data-project-slug="{{ p.slug }}" data-project-no="{{ p.no }}" data-project-title="{{ p.title }}" data-project-tags="{{ p.tags }}" data-project-desc="{{ p.work_description | escape }}" data-project-url="{{ site.baseurl }}{{ p.url }}" style="display:flex;flex-direction:column;gap:16px;cursor:pointer">
        <div style="background:#f2f2f0;overflow:hidden;position:relative">
          <image-slot id="w{{ forloop.index }}" shape="rect" src="{{ site.baseurl }}/{{ p.thumb }}" placeholder="Drop project image"></image-slot>
          {% if p.video and p.video != "" %}
            <video src="{{ p.video }}" poster="{{ site.baseurl }}/{{ p.thumb }}" autoPlay muted loop playsInline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"></video>
          {% endif %}
        </div>
        <div style="display:flex;align-items:baseline;justify-content:space-between;padding-right:8px">
          <div style="display:flex;align-items:baseline;gap:14px;min-width:0">
            <span style="font-size:12px;font-weight:500;color:#b4b4b4;letter-spacing:.06em">{{ p.no }}</span>
            <div style="display:flex;flex-direction:column;gap:3px;min-width:0">
              <span style="font-size:19px;font-weight:500;letter-spacing:-0.01em">{{ p.title }}</span>
              <span style="font-size:12px;font-weight:500;color:#8a8a8a;text-transform:uppercase;letter-spacing:.09em">{{ p.tags }}</span>
            </div>
          </div>
          <button class="quick-view-btn" style="background:none;border:1px solid #ccc;border-radius:12px;padding:3px 8px;font-size:11px;font-weight:500;color:#555;cursor:pointer">Details</button>
        </div>

        <!-- Hidden JSON store for work_details array -->
        <script type="application/json" id="details-data-{{ p.slug }}">
          [
            {% for item in p.work_details %}
              {"label": {{ item.label | json }}, "value": {{ item.value | json }}}{% unless forloop.last %},{% endunless %}
            {% endfor %}
          ]
        </script>
      </div>
    {% endfor %}
  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const drawer = document.getElementById('work-detail-drawer');
  const closeBtn = document.getElementById('work-drawer-close');
  const drawerNo = document.getElementById('drawer-no');
  const drawerTitle = document.getElementById('drawer-title');
  const drawerTags = document.getElementById('drawer-tags');
  const drawerDesc = document.getElementById('drawer-description');
  const drawerLink = document.getElementById('drawer-casestudy-link');
  const drawerDetailsList = document.getElementById('drawer-details-list');

  if (!drawer) return;

  closeBtn.addEventListener('click', function() {
    drawer.style.display = 'none';
  });

  document.querySelectorAll('.work-tile-item').forEach(function(tile) {
    tile.addEventListener('click', function(e) {
      if (e.target.tagName === 'A' && e.target.classList.contains('full-case-study')) return;

      const slug = tile.getAttribute('data-project-slug');
      const no = tile.getAttribute('data-project-no');
      const title = tile.getAttribute('data-project-title');
      const tags = tile.getAttribute('data-project-tags');
      const desc = tile.getAttribute('data-project-desc');
      const url = tile.getAttribute('data-project-url');

      drawerNo.textContent = no;
      drawerTitle.textContent = title;
      drawerTags.textContent = tags;
      drawerDesc.textContent = desc || 'Detailed work specifications and narrative available in full case study.';
      drawerLink.setAttribute('href', url);

      drawerDetailsList.innerHTML = '';
      const scriptEl = document.getElementById('details-data-' + slug);
      if (scriptEl) {
        try {
          const items = JSON.parse(scriptEl.textContent);
          items.forEach(function(it) {
            const div = document.createElement('div');
            div.style.borderBottom = '1px solid #f0f0ec';
            div.style.paddingBottom = '8px';
            div.innerHTML = '<strong style="color:#0a0a0a;display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em">' + it.label + '</strong><span style="color:#666">' + it.value + '</span>';
            drawerDetailsList.appendChild(div);
          });
        } catch(err) {
          console.error(err);
        }
      }

      drawer.style.display = 'block';
      drawer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  });
});
</script>
