<header style="position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:26px 44px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px)">
  <a href="{{ site.baseurl }}/" style="display:flex;align-items:center"><img src="{{ site.baseurl }}/{{ site.data.site.logo.header }}" alt="{{ site.data.site.site_name }}" style="height:36px;display:block"></a>
  <div style="display:flex;align-items:center;gap:44px">
    <nav style="display:flex;gap:40px;font-size:19px;font-weight:500">
      {% for item in site.data.site.nav %}
        <a href="{{ site.baseurl }}/{{ item.href }}" {% if page.url == item.href or (page.url == '/' and item.href == '#work') %}style="color:#9a9a9a"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
    <button onClick="{{ toggleTheme }}" aria-label="Toggle theme" style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;font-family:inherit;color:#0a0a0a;background:none;border:1px solid #0a0a0a;border-radius:999px;cursor:pointer;padding:0">{{ themeIcon }}</button>
    <div style="display:flex;flex-direction:column;gap:6px;cursor:pointer;padding:4px 0">
      <span style="display:block;width:30px;height:2.5px;background:#0a0a0a"></span>
      <span style="display:block;width:30px;height:2.5px;background:#0a0a0a"></span>
      <span style="display:block;width:30px;height:2.5px;background:#0a0a0a"></span>
    </div>
  </div>
</header>
